# Split deployment: nginx serves the SPA and proxies /api to the backend.
# Only needed for the `split` compose profile; the default single-process
# deployment serves both from FastAPI.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so they can be cached hard. index.html must not
    # be, or a deploy leaves clients pinned to a stale bundle that references
    # assets which no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths get the SPA shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A 5M-document workspace can take a while on a cold cache, and the
        # default 60s read timeout would surface as an opaque 504.
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;

        # API responses are per-workspace private data. Nothing in this app is
        # cacheable by a shared proxy.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
    add_header X-Frame-Options DENY;
}
