# OmniLinker - the real MongoDB + Neo4j path.
#
# This is the profile the blueprint specifies, and the one you would deploy.
# It exists so that "run it locally with one command" and "run it properly" are
# the same codebase rather than two codebases that drift.
#
#   docker compose up -d
#   curl -XPOST localhost:8900/api/sync -d '{"connector_id":"demo"}' -H 'content-type: application/json'
#
# `docker compose --profile embedded up -d` instead runs the API with no
# external services at all - the default local development path.

name: omnilinker

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: omnilinker
    volumes:
      - mongo-data:/data/db
    # Not published to the host. Nothing outside the compose network has any
    # business reaching the document store, and a published port is the easiest
    # way to accidentally grant it.
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [omni]

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-omnilinker}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
    expose:
      - "7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [omni]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      OMNI_MODE: docker
      OMNI_DATA_DIR: /data
      OMNI_WORKSPACE: ${OMNI_WORKSPACE:-ws_local}
      OMNI_ENCRYPT: "1"
      # Hybrid retrieval on: the second leg is a hashed embedding, so it needs
      # no model and no network, and it is measurably better than BM25 alone.
      OMNI_VECTOR: "1"
      OMNI_EMBED_MODEL: ${OMNI_EMBED_MODEL:-hash-1024}
      AI_MODE: ${AI_MODE:-extractive}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: omnilinker
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-omnilinker}
      OMNI_CORS: ${OMNI_CORS:-}
    volumes:
      # The keystore. Back this up and treat it as the only irreplaceable
      # artefact in the system: without it, every sealed body is unrecoverable.
      - omni-keys:/data
    ports:
      - "${OMNI_PORT:-8900}:8000"
    networks: [omni]

  # Optional: the built frontend, served by nginx. Not required - the API
  # serves `frontend/dist` itself when it is present - but it keeps the API
  # process free of static-file work in a real deployment.
  web:
    profiles: ["split"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${OMNI_WEB_PORT:-8080}:80"
    networks: [omni]

volumes:
  mongo-data:
  neo4j-data:
  # Named volume, not a bind mount: the keystore must not be readable by
  # whatever uid the host happens to use.
  omni-keys:

networks:
  omni:
    driver: bridge
